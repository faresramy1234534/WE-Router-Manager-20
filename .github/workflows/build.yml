name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper & Build
        run: |
          # البحث عن ملف gradlew وتحديد مكانه
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in $DIR"
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found, looking for root android project..."
            BUILD_PATH=$(find . -name "build.gradle" | head -n 1)
            if [ -n "$BUILD_PATH" ]; then
              DIR=$(dirname "$BUILD_PATH")
              cd "$DIR"
              gradle wrapper
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "No Android project files found!"
              exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
